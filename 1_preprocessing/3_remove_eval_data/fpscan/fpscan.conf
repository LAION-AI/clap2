# fpscan parameters (key = value). The index records the file it was built with; the scan must use the same one.

# processing chunks of 60 s (frames of 8 ms) with context on both sides
chunk_frames = 7500
margin_frames = 256
# virtual level normalisation: the p90 frame level of each clip is taken to norm_target_db (gain <= norm_max_gain_db)
# by shifting every absolute gate below, so quiet recordings keep their peaks
norm_target_db = -20
norm_max_gain_db = 60

# M2 landmarks: peaks = maxima in +-dt frames x +-dk bins, delta_db above the +-mean_w running mean of their band of
# band_w bins, kmin (140.6 Hz) .. fmax (eval side: <= 0.95 band_hz); hash = anchor + 2 of the first fanout targets
# within zt frames and +-zk bins; eval audios < pair_max_eval_s also get 2-peak hashes
m2_kmin = 9
m2_fmax_hz = 7500
m2_floor_db = -90
m2_silence_db = -70
m2_mean_w = 62
m2_band_w = 16
m2_zt = 31
m2_zk = 63
m2_dt = 7
m2_dk = 11
m2_delta_db = 9
m2_fanout = 4
m2_pair_max_eval_s = 2.0
m2_stop_max = 200
# candidate: >= min_votes time-consistent hashes spanning >= min_span_s, or >= min_votes_frac and >= frac of the
# eval audio's hashes
m2_min_votes = 8
m2_min_span_s = 0.5
m2_min_votes_frac = 5
m2_frac = 0.30

# M3 sub-fingerprints: 33 log bands f_lo .. f_hi (f_hi_narrow for eval audios with band_hz < narrow_below_hz),
# triangle smoothing of ~0.36 s, one 32-bit sub-fp per 16 ms; candidate if the BER over a block of <= block
# sub-fps (>= min_block, short evals 80 % of theirs) is <= ber_thr
m3_f_lo = 300
m3_f_hi = 5000
m3_f_hi_narrow = 3800
m3_narrow_below_hz = 5000
m3_smooth_half = 11
m3_silence_db = -70
m3_stop_max = 200
m3_ber_thr = 0.25
m3_block = 256
m3_min_block = 12
m3_max_keys = 20000

# V: band v_band_lo .. min(v_band_hi, 0.98 band_hz); lag refined within +-refine_s over <= xc_max_s; PSR sidelobes
# side_lo_s .. side_hi_s from the peak; matched region from local NCC in win_s windows (|NCC| >= local_thr, <= gap_windows
# bad windows in a row; windows quiet on both sides are neutral); M2 and M3 candidates within merge_lag_s share one V
v_band_lo = 100
v_band_hi = 7000
v_refine_s = 0.100
v_side_lo_s = 0.3
v_side_hi_s = 2.0
v_xc_max_s = 30
v_max_overlap_s = 120
v_win_s = 0.25
v_local_thr = 0.2
v_gap_windows = 4
v_merge_lag_s = 0.25
v_quiet_rel_db = 45
v_quiet_floor_dbfs = -90
v_logmel_floor_db = -70
# classes, in this order: C0 same PCM, C2 excerpt / containment, C1 same recording in another rendering,
# C3 mixture component, else REJECT; eval audios <= short_eval_s need rho >= short_rho for any class
v_c0_rho = 0.999
v_c0_cov = 0.98
v_c2_rho = 0.95
v_c2_min_overlap_s = 1.0
v_c2_min_overlap_frac = 0.9
v_c2_cov = 0.25
v_c1_rho = 0.95
v_c1_rho_lm = 0.5
v_c1_logmel = 0.95
v_c1_cov_eval = 0.9
v_c3_rho = 0.3
v_c3_psr = 6
v_c3_min_overlap_s = 2.0
v_short_eval_s = 1.5
v_short_rho = 0.95
